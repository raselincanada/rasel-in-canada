backend:
  name: github
  repo: Raselincanada/rasel-in-canada
  branch: main

site_url: https://raselincanada.ca
display_url: https://raselincanada.ca
logo_url: https://raselincanada.ca/assets/brand-logo.svg
publish_mode: simple
media_folder: source/assets/uploads
public_folder: /assets/uploads

collections:
  - name: settings
    label: Website Settings
    files:
      - name: main
        label: Homepage, About & Social Links
        file: content/settings.json
        format: json
        fields:
          - { label: Website Name, name: site_name, widget: string }
          - { label: Homepage Small Heading, name: hero_eyebrow, widget: string }
          - { label: Homepage Main Heading, name: hero_title, widget: string, hint: "Use three or more words, for example: TRAVEL WITHOUT LIMITS" }
          - { label: Homepage Introduction, name: hero_text, widget: text }
          - { label: Homepage Story, name: homepage_story, widget: text }
          - { label: About Page Story, name: about_story, widget: markdown }
          - { label: Contact Introduction, name: contact_intro, widget: text }
          - { label: Contact Email, name: email, widget: string }
          - { label: YouTube Link, name: youtube, widget: string }
          - { label: Facebook Link, name: facebook, widget: string }
          - { label: Instagram Link, name: instagram, widget: string }
          - { label: TikTok Link, name: tiktok, widget: string }

  - name: stories
    label: Stories & Albums
    label_singular: Story or Album
    folder: content/stories
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{province}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Province, name: province, widget: select, options: [Nova Scotia, Ontario, Quebec, Alberta, New Brunswick, Prince Edward Island, Newfoundland and Labrador, Manitoba, Saskatchewan, British Columbia, Yukon, Northwest Territories, Nunavut, Outside Canada] }
      - { label: Place or City, name: place, widget: string, required: false }
      - { label: Travel Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Short Description, name: excerpt, widget: text }
      - { label: Full Story, name: body, widget: markdown }
      - { label: Featured Photo, name: featured_image, widget: image, required: false }
      - label: Photo Gallery
        name: gallery
        widget: list
        required: false
        field: { label: Photo, name: image, widget: image }
      - { label: YouTube or Video Link, name: video, widget: string, required: false }
      - { label: Feature on Homepage, name: featured, widget: boolean, default: true }

  - name: guides
    label: Canada Guides
    label_singular: Canada Guide
    folder: content/guides
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Icon, name: icon, widget: string, default: "🍁", hint: "Enter one emoji" }
      - { label: Short Description, name: excerpt, widget: text }
      - { label: Full Guide, name: body, widget: markdown }
      - { label: Featured Photo, name: featured_image, widget: image, required: false }
      - { label: Feature on Homepage, name: featured, widget: boolean, default: false }
